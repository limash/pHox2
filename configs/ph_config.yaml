# ──────────────────────────────────────────────────────────────────────────────
# Instrument type
# ──────────────────────────────────────────────────────────────────────────────
instrument_type: ph

# ──────────────────────────────────────────────────────────────────────────────
# Hardware backend selection
# ──────────────────────────────────────────────────────────────────────────────
hardware:
  use_mock: true          # set to false on real Raspberry Pi instrument

# ──────────────────────────────────────────────────────────────────────────────
# GPIO pin assignments (BCM numbering, shared with CO3 except light/shutter)
# ──────────────────────────────────────────────────────────────────────────────
gpio:
  # Bistable inlet valve — [enable, channel_1, channel_2]
  valve_enable_pin: 24
  valve_ch1_pin: 23
  valve_ch2_pin: 25
  valve_toggle_duration_s: 0.3

  water_pump_pin: 21             # sample flush pump relay
  dye_pump_pin: 19               # dye solenoid pump relay
  stirrer_pin: 20                # magnetic stirrer relay
  drain_pin: 16                  # drain valve relay
  air_pin: 26                    # compressed-air pump relay

# ──────────────────────────────────────────────────────────────────────────────
# ADC (ADCDifferentialPi, I²C)
# ──────────────────────────────────────────────────────────────────────────────
adc:
  temperature_channel: 8

# ──────────────────────────────────────────────────────────────────────────────
# Temperature probe
# ──────────────────────────────────────────────────────────────────────────────
temperature:
  calibration_coefficients: [-1.234, 15.678]
  n_averages: 3

# ──────────────────────────────────────────────────────────────────────────────
# Spectrometer
# ──────────────────────────────────────────────────────────────────────────────
spectrometer:
  integration_time_ms: 18.0
  n_averages: 6
  light_threshold_counts: 60000
  autoadjust:
    mode: "ON"                   # ON | OFF | ON_NORED
    tolerance_fraction: 0.05
    max_iterations: 20
    step_ms: 500

# ──────────────────────────────────────────────────────────────────────────────
# pH chemistry
# ──────────────────────────────────────────────────────────────────────────────
ph:
  # Dye indicator: MCP (m-Cresol Purple) or TB (Thymol Blue)
  dye: "MCP"

  # Wavelengths (nm) — matched to dye choice
  wavelength_1_nm: 434.0    # acid-form peak (same for MCP and TB)
  wavelength_2_nm: 578.0    # base-form peak (578 MCP / 596 TB)
  nir_nm: 730.0             # NIR reference (baseline correction)

  # LED PWM pins (BCM) — [Blue 434 nm, Orange 578 nm, Red 730 nm, spare]
  led_slots: [12, 13, 19, 16]

  # Initial LED duty cycles (0–100 %) at instrument start
  led_duties: [55, 55, 55, 0]

# ──────────────────────────────────────────────────────────────────────────────
# Tris buffer calibration
# ──────────────────────────────────────────────────────────────────────────────
tris_buffer:
  salinity: 35                   # salinity of Tris calibration solution
  temperature: 20                # nominal calibration temperature (°C)
  calibration_threshold: 0.005   # max |ΔpH| between measured and theoretical
  pump_time_s: 30                # seconds to pump calibration solution

# ──────────────────────────────────────────────────────────────────────────────
# Continuous mode
# ──────────────────────────────────────────────────────────────────────────────
continuous:
  interval_s: 300              # seconds between automatic measurements
  autostart: false             # start continuous mode automatically on launch

# ──────────────────────────────────────────────────────────────────────────────
# Measurement cycle
# ──────────────────────────────────────────────────────────────────────────────
measurement:
  cuvette_volume_ml: 16.0
  dye_volume_per_shot_ml: 0.03
  dye_n_shots: 6
  n_cycles: 4                    # 4 injections for multi-injection regression
  mix_time_s: 10.0
  wait_time_s: 5.0
  pump_time_s: 60.0
  drain_after: true
  drain_time_s: 60.0
  time_acceleration: 100

# ──────────────────────────────────────────────────────────────────────────────
# Ship / platform
# ──────────────────────────────────────────────────────────────────────────────
ship:
  code: "NB"

# ──────────────────────────────────────────────────────────────────────────────
# Output
# ──────────────────────────────────────────────────────────────────────────────
output:
  base_path: "~/phox_data"

# ──────────────────────────────────────────────────────────────────────────────
# Ferrybox UDP communication
# ──────────────────────────────────────────────────────────────────────────────
ferrybox:
  enabled: false            # set to true to activate UDP communication
  host: "192.168.1.100"    # Ferrybox IP address
  ferrybox_port: 5556       # UDP port the Ferrybox listens on (instrument → Ferrybox)
  local_port: 5555          # local UDP port to bind  (Ferrybox → instrument)

# ──────────────────────────────────────────────────────────────────────────────
# Hydra
# ──────────────────────────────────────────────────────────────────────────────
hydra:
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
