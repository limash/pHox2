[project]
name = "co3-instrument"
version = "0.1.0"
description = "Standalone CO3 seawater spectrophotometric instrument module"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Real hardware drivers — install only on Raspberry Pi
hardware = [
    "seabreeze>=1.4",
    # pigpio and ADCDifferentialPi are typically system-installed on RPi
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
co3-measure = "co3_instrument.scripts.run_single_measurement:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/co3_instrument"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
