[project]
name = "phox2"
version = "0.1.0"
description = "Standalone pH and CO3 seawater spectrophotometric instrument module"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Real hardware drivers — install only on Raspberry Pi
hardware = [
    "seabreeze>=1.4",
    "pyusb>=1.2",
    "lgpio>=0.2",
    # ADCDifferentialPi is not on PyPI — install manually on the Pi:
    #   wget https://raw.githubusercontent.com/abelectronicsuk/ABElectronics_Python_Libraries/master/ADCDifferentialPi/ADCDifferentialPi.py \
    #     -O .venv/lib/python3.13/site-packages/ADCDifferentialPi.py
]
gui = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
phox2-measure = "phox2.scripts.run_single_measurement:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phox2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
